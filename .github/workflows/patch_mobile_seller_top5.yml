name: One-off mobile seller Top 5

on:
  push:
    paths:
      - '.github/workflows/patch_mobile_seller_top5.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch app for mobile-visible seller Top 5
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('app.py')
          text = p.read_text(encoding='utf-8')

          # Remove the old sidebar-only seller block if it exists. It was appended at EOF.
          marker = '# SELLER_TOP5_UI_V1'
          if marker in text:
              text = text.split(marker, 1)[0].rstrip() + '\n'

          mobile_marker = '# SELLER_TOP5_MOBILE_HOME_V1'
          if mobile_marker not in text:
              anchor = 'DATABASE_URL = _resolve_database_url()\n'
              if anchor not in text:
                  raise SystemExit('DATABASE_URL anchor missing')
              block = r'''

# SELLER_TOP5_MOBILE_HOME_V1
with st.expander("🏪 Fynd hos en säljare", expanded=False):
    st.caption("Skriv ett Tradera-säljarnamn så går FlipFynd igenom säljarens aktiva annonser och visar de fem bästa möjligheterna.")
    seller_top5_alias = st.text_input(
        "Säljarnamn på Tradera",
        key="seller_top5_alias_mobile",
        placeholder="t.ex. Etanol71",
    )
    seller_top5_sport_label = st.radio(
        "Sport",
        ["Hockey", "Fotboll"],
        horizontal=True,
        key="seller_top5_sport_mobile",
    )
    if st.button(
        "🔎 Hitta säljarens 5 bästa fynd",
        key="seller_top5_run_mobile",
        type="primary",
        use_container_width=True,
    ):
        alias = str(seller_top5_alias or "").strip()
        if not alias:
            st.warning("Ange ett säljarnamn först.")
        else:
            creds = _resolve_tradera_api_credentials()
            if not creds:
                st.error("Tradera API är inte konfigurerat, så säljarens aktiva annonser kan inte hämtas automatiskt ännu.")
            else:
                with st.spinner(f"Hämtar och analyserar aktiva annonser från {alias}…"):
                    fetched = discover_active_seller_inventory(
                        seller_alias=alias,
                        app_id=creds[0],
                        app_key=creds[1],
                        category_id=0,
                    )
                    if not fetched.get("ok"):
                        st.error("Kunde inte hämta säljarens aktiva annonser från Tradera.")
                        if fetched.get("status"):
                            st.caption(f"Status: {fetched.get('status')}")
                    else:
                        items = fetched.get("items") or []
                        sport_key = "hockey" if seller_top5_sport_label == "Hockey" else "fotboll"
                        top5 = build_seller_top5(
                            alias,
                            items,
                            analyze_fn=analyze_item,
                            sport=sport_key,
                            quick_limit=max(60, len(items)),
                            full_limit=10,
                        )
                        st.session_state["seller_top5_result_mobile"] = top5

    seller_top5_result = st.session_state.get("seller_top5_result_mobile")
    if seller_top5_result:
        seller_name = seller_top5_result.get("seller") or str(seller_top5_alias or "").strip()
        inv_count = int(seller_top5_result.get("inventory_count") or 0)
        quick_count = int(seller_top5_result.get("quick_analysed") or 0)
        full_count = int(seller_top5_result.get("full_analysed") or 0)
        st.markdown(f"### 🏆 Top 5 hos {seller_name}")
        st.caption(f"{inv_count} aktiva annonser · {quick_count}/{inv_count if inv_count else quick_count} granskade · {full_count} fullanalyserade")
        rows = seller_top5_result.get("rows") or []
        if not rows:
            st.info("Inga tillräckligt analyserbara kandidater hittades hos säljaren just nu.")
        for idx, row in enumerate(rows[:5], start=1):
            title = row.get("title") or "Kortannons"
            price = row.get("price")
            decision = str(row.get("decision") or "UNDERSÖK")
            label = row.get("label") or "BEHÖVER VERIFIERAS"
            st.markdown(f"**#{idx} {title}**")
            facts = []
            if price is not None:
                try:
                    facts.append(f"{float(price):.0f} kr")
                except (TypeError, ValueError):
                    pass
            facts.extend([decision, label])
            st.caption(" · ".join(facts))
            sold = int(row.get("sold_comps") or 0)
            edge = float(row.get("market_edge") or 0)
            st.caption(f"Exact SOLD: {sold} · market edge: {edge:.0f}/100")
            if row.get("reason"):
                st.caption(row.get("reason"))
            if row.get("url"):
                st.link_button("Öppna annonsen ↗", row.get("url"), use_container_width=True)
            st.divider()
'''
              text = text.replace(anchor, anchor + block, 1)

          text = re.sub(r'APP_VERSION = "v0\.12\.\d+"', 'APP_VERSION = "v0.12.84"', text, count=1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Validate
        run: |
          python -m compileall -q app.py src tests
          python -m pytest -q tests/test_seller_top5.py tests/test_seller_bundle_opportunity.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'FlipFynd automation'
          git config user.email 'actions@users.noreply.github.com'
          git add app.py
          git commit -m 'Show seller Top 5 on mobile home'
          git push origin HEAD:main
