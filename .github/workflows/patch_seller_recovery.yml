name: One-off seller recovery

on:
  push:
    paths:
      - '.github/workflows/patch_seller_recovery.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch app seller recovery
        shell: bash
        run: >-
          python -c 'from pathlib import Path; import re; p=Path("app.py"); s=p.read_text(encoding="utf-8"); needle="from src.seller_bundle_opportunity import find_same_seller_listings, build_shared_shipping_scenario, classify_same_seller_addon, build_best_same_seller_basket\n"; s=s if "from src.seller_identity import recover_seller_from_market\n" in s else s.replace(needle, needle+"from src.seller_identity import recover_seller_from_market\n", 1); old="    seller = get_seller(item)\n    label = \"🧺 Fler kort från samma säljare\"\n    with st.popover(label, use_container_width=True):\n        if seller == \"Okänd\":\n            st.info(\"FlipFynd kan inte säkert identifiera säljaren i den här annonsen ännu.\")\n            return\n        seller_market = list(data or [])\n"; new="    seller_market = list(data or [])\n    seller, item = recover_seller_from_market(item, seller_market)\n    label = \"🧺 Fler kort från samma säljare\"\n    with st.popover(label, use_container_width=True):\n        if not seller:\n            st.info(\"FlipFynd hittar ännu inget säkert säljaralias för just den här annonsen. Annonsen har först matchats mot den inlästa marknaden.\")\n            return\n"; assert old in s, "same-seller block not found"; s=s.replace(old,new,1); s=re.sub(r"APP_VERSION = \"v0\\.12\\.\\d+\"", "APP_VERSION = \"v0.12.82\"", s, count=1); p.write_text(s,encoding="utf-8")'
      - name: Validate syntax
        run: python -m compileall -q app.py src
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'FlipFynd automation'
          git config user.email 'actions@users.noreply.github.com'
          git add app.py
          git commit -m 'Recover seller identity before same-seller search'
          git push origin HEAD:main
