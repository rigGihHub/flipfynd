name: One-off seller recovery

on:
  push:
    paths:
      - '.github/workflows/patch_seller_recovery.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch seller recovery
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app = Path('app.py')
          text = app.read_text(encoding='utf-8')

          # Make seller extraction robust across analysed rows, fetched rows and API payloads.
          pattern = re.compile(r'def get_seller\(item\):\n.*?\n\n\ndef get_data_version\(\):', re.S)
          replacement = '''def get_seller(item):
    item = item or {}
    for key in [
        "saljare", "säljare", "seller", "seller_name", "username", "seller_detail", "seller_alias", "alias",
    ]:
        value = item.get(key)
        if isinstance(value, dict):
            for nested_key in ("alias", "Alias", "username", "Username", "name", "Name"):
                nested = value.get(nested_key)
                if nested not in (None, "") and str(nested).strip():
                    return str(nested).strip()
        elif value not in (None, "") and str(value).strip():
            return str(value).strip()

    for container_key in ("raw_api_item", "raw_item", "source_item"):
        nested = item.get(container_key)
        if isinstance(nested, dict):
            seller = get_seller(nested)
            if seller != "Okänd":
                return seller
    return "Okänd"


def _listing_identity_tokens(item):
    item = item or {}
    ids = {str(item.get(k)).strip() for k in ("tradera_item_id", "item_id", "id") if item.get(k) not in (None, "")}
    urls = {str(item.get(k)).strip() for k in ("lank", "url", "link", "href", "item_url", "tradera_url") if item.get(k)}
    title = str(item.get("titel") or item.get("title") or "").strip().casefold()
    return ids, urls, title


def recover_seller_from_market(item, market_items):
    seller = get_seller(item)
    if seller != "Okänd":
        return seller, item
    ids, urls, title = _listing_identity_tokens(item)
    for source in market_items or []:
        if not isinstance(source, dict):
            continue
        s_ids, s_urls, s_title = _listing_identity_tokens(source)
        same = bool(ids & s_ids or urls & s_urls)
        if not same and title and s_title == title:
            try:
                p1 = float(item.get("pris") or item.get("price"))
                p2 = float(source.get("pris") or source.get("price"))
                same = abs(p1 - p2) < 0.01
            except (TypeError, ValueError):
                pass
        if same:
            recovered = get_seller(source)
            if recovered != "Okänd":
                merged = dict(source)
                merged.update(item)
                for k in ("saljare", "säljare", "seller", "seller_name", "username", "seller_detail", "seller_alias"):
                    if source.get(k) not in (None, "") and not merged.get(k):
                        merged[k] = source.get(k)
                return recovered, merged
    return "Okänd", item


def get_data_version():'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('Could not patch get_seller block')

          old = '''def render_same_seller_button(item: dict, key: str) -> None:
    """Find more cards from the same seller so shipping may be shared."""
    seller = get_seller(item)
    label = "🧺 Fler kort från samma säljare"
    with st.popover(label, use_container_width=True):
        if seller == "Okänd":
            st.info("FlipFynd kan inte säkert identifiera säljaren i den här annonsen ännu.")
            return
        seller_market = list(data or [])
'''
          new = '''def render_same_seller_button(item: dict, key: str) -> None:
    """Find more cards from the same seller so shipping may be shared."""
    seller_market = list(data or [])
    seller, item = recover_seller_from_market(item, seller_market)
    label = "🧺 Fler kort från samma säljare"
    with st.popover(label, use_container_width=True):
        if seller == "Okänd":
            st.info("FlipFynd hittar ännu inget säkert säljaralias för just den här annonsen. Annonsen är matchad mot den inlästa marknaden innan vi ger upp.")
            return
'''
          if old not in text:
              raise SystemExit('Could not patch render_same_seller_button header')
          text = text.replace(old, new, 1)
          text = re.sub(r'APP_VERSION = "v0\.12\.\d+"', 'APP_VERSION = "v0.12.82"', text, count=1)
          app.write_text(text, encoding='utf-8')

          # Also make the basket helper understand nested/API seller fields.
          helper = Path('src/seller_bundle_opportunity.py')
          h = helper.read_text(encoding='utf-8')
          old_seller = '''def _seller(item: dict) -> str | None:
    for key in ("saljare", "säljare", "seller", "seller_name", "username", "seller_detail"):
        value = item.get(key)
        if value not in (None, "") and str(value).strip():
            return str(value).strip()
    return None
'''
          new_seller = '''def _seller(item: dict) -> str | None:
    item = item or {}
    for key in ("saljare", "säljare", "seller", "seller_name", "username", "seller_detail", "seller_alias", "alias"):
        value = item.get(key)
        if isinstance(value, dict):
            for nested_key in ("alias", "Alias", "username", "Username", "name", "Name"):
                nested = value.get(nested_key)
                if nested not in (None, "") and str(nested).strip():
                    return str(nested).strip()
        elif value not in (None, "") and str(value).strip():
            return str(value).strip()
    for container_key in ("raw_api_item", "raw_item", "source_item"):
        nested = item.get(container_key)
        if isinstance(nested, dict):
            seller = _seller(nested)
            if seller:
                return seller
    return None
'''
          if old_seller not in h:
              raise SystemExit('Could not patch seller helper')
          helper.write_text(h.replace(old_seller, new_seller, 1), encoding='utf-8')

          test = Path('tests/test_seller_bundle_opportunity.py')
          t = test.read_text(encoding='utf-8')
          t += '''\n\ndef test_nested_api_seller_alias_is_supported():\n    current={"seller":{"alias":"cardswe"},"lank":"a","pris":100}\n    market=[current,{"raw_api_item":{"seller":{"alias":"cardswe"}},"lank":"b","titel":"B","pris":20}]\n    out=find_same_seller_listings(current, market)\n    assert out["status"] == "FOUND"\n    assert out["count"] == 1\n\ndef test_seller_detail_string_is_supported():\n    current={"seller_detail":"cardswe","lank":"a","pris":100}\n    market=[current,{"seller_detail":"cardswe","lank":"b","titel":"B","pris":20}]\n    assert find_same_seller_listings(current, market)["count"] == 1\n'''
          test.write_text(t, encoding='utf-8')
          PY
      - name: Install tests
        run: python -m pip install -q pytest
      - name: Validate
        run: |
          python -m compileall -q app.py src tests
          python -m pytest -q tests/test_seller_bundle_opportunity.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'FlipFynd automation'
          git config user.email 'actions@users.noreply.github.com'
          git add app.py src/seller_bundle_opportunity.py tests/test_seller_bundle_opportunity.py
          git commit -m 'Recover seller identity before same-seller search'
          git push origin HEAD:main
