name: One-time Seller Top 5 integration

on:
  push:
    paths:
      - '.github/workflows/one_time_patch_seller_top5.yml'
      - 'scripts/patch_seller_top5_live.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic patch
        run: python scripts/patch_seller_top5_live.py
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile
        run: python -m compileall -q app.py src tests
      - name: Test
        run: pytest -q
      - name: Commit live integration
        run: |
          if git diff --quiet -- app.py; then
            echo 'No app.py changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'Wire Seller Top 5 API-first local fallback into live app'
          git push origin HEAD:main
