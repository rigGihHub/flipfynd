name: FlipFynd CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Apply Seller Top 5 v0.12.85 continuation fix
        run: python scripts/patch_seller_top5_v01285.py

      - name: Apply Seller Top 5 v0.12.86 UX fix
        run: python scripts/patch_seller_top5_v01286.py

      - name: Apply Seller Top 5 v0.12.87 fast provisional ranking
        run: python scripts/patch_seller_top5_v01287.py

      - name: Apply Seller Top 5 v0.12.88 one-page batches
        run: python scripts/patch_seller_top5_v01288.py

      - name: Apply Seller Top 5 v0.12.89 compatibility fix
        run: python scripts/patch_seller_top5_v01289.py

      - name: Apply Seller Top 5 v0.12.90 robust parser fix
        run: python scripts/patch_seller_top5_v01290.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile Python sources
        run: python -m compileall -q app.py src tests

      - name: Run test suite
        run: pytest -q

      - name: Commit verified Seller Top 5 changes
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- app.py VERSION src/seller_top5_controller.py src/public_seller_inventory.py; then
            echo 'No Seller Top 5 changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '4189824+github-actions[bot]@users.noreply.github.com'
          git add app.py VERSION src/seller_top5_controller.py src/public_seller_inventory.py
          git commit -m 'Make public seller scan robust and visible'
          git push origin HEAD:main