name: FlipFynd CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Apply compatibility patch
        run: python scripts/patch_public_import_progress_compat.py

      - name: Apply clean Seller Top 5 UI patch
        run: python scripts/patch_seller_top5_ui_clean.py

      - name: Apply dynamic Seller Top 5 patch
        run: python scripts/patch_seller_dynamic_top5.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile Python sources
        run: python -m compileall -q app.py src tests

      - name: Run test suite
        run: pytest -q

      - name: Commit verified Seller Top 5 changes
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- app.py src/seller_top5_controller.py; then
            echo 'No Seller Top 5 changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '4189824+github-actions[bot]@users.noreply.github.com'
          git add app.py src/seller_top5_controller.py
          git commit -m 'Enable dynamic Seller Top 5 previews and deeper final analysis'
          git push origin HEAD:main
