name: One-off seller Top 5 UI

on:
  push:
    paths:
      - '.github/workflows/patch_seller_top5.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch app
        run: python tools/patch_seller_top5_ui.py
      - name: Install test deps
        run: |
          python -m pip install -q pytest
          pip install -q -r requirements.txt
      - name: Validate
        run: |
          python -m compileall -q app.py src tests
          python -m pytest -q tests/test_seller_top5.py tests/test_seller_bundle_opportunity.py
      - name: Commit patch
        run: |
          git config user.name 'FlipFynd automation'
          git config user.email 'actions@users.noreply.github.com'
          git add app.py
          git commit -m 'Add seller Top 5 finder to FlipFynd'
          git push origin HEAD:main
