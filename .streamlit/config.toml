[theme]
base = "dark"
primaryColor = "#e86f3b"
backgroundColor = "#111317"
secondaryBackgroundColor = "#202329"
textColor = "#f4ead7"
font = "sans serif"

[server]
# Brief mobile suspension keeps the session; longer returns use the durable
# workspace/job recovery instead of retaining abandoned large sessions for hours.
disconnectedSessionTTL = 300
